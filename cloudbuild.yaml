steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/komposer:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/komposer:latest"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/komposer:latest"
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "komposer"
      - "--image"
      - "gcr.io/$PROJECT_ID/komposer:latest"
      - "--region"
      - "asia-northeast3"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "1Gi"
images:
  - "gcr.io/$PROJECT_ID/komposer:latest"

